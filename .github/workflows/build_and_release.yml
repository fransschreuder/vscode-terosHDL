name: Build and release TerosHDL

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

env:
  VERIBLE_VERSION: v0.0-3958-g7aae5c08

jobs:
  ##############################################################################
  # Build the verible language server from source
  ##############################################################################
  build-verible-linux:
    name: Build verible-verilog-ls (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout verible
        uses: actions/checkout@v4
        with:
          repository: chipsalliance/verible
          ref: ${{ env.VERIBLE_VERSION }}
          path: verible
          fetch-depth: 0

      - name: Install bazel
        run: |
          # Install under a name that cannot be shadowed by the bazelisk
          # binary that ships with the runner images and would resolve to
          # the latest bazel, which is incompatible with verible's .bazelrc.
          sudo wget --no-verbose "https://github.com/bazelbuild/bazel/releases/download/6.5.0/bazel-6.5.0-linux-x86_64" -O /usr/bin/bazel-6.5.0
          sudo chmod +x /usr/bin/bazel-6.5.0
          /usr/bin/bazel-6.5.0 --version

      - name: Cache bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-verible-bazel-${{ env.VERIBLE_VERSION }}

      - name: Build verible-verilog-ls
        working-directory: verible
        run: |
          /usr/bin/bazel-6.5.0 build -c opt --config=create_static_linked_executables //verible/verilog/tools/ls:verible-verilog-ls
          # Litmus test
          bazel-bin/verible/verilog/tools/ls/verible-verilog-ls --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: verible-verilog-ls-linux
          path: verible/bazel-bin/verible/verilog/tools/ls/verible-verilog-ls

  build-verible-windows:
    name: Build verible-verilog-ls (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout verible
        uses: actions/checkout@v4
        with:
          repository: chipsalliance/verible
          ref: ${{ env.VERIBLE_VERSION }}
          path: verible
          fetch-depth: 0

      - name: Install dependencies
        run: |
          choco install bazel --force --version=6.5.0
          choco install winflexbison3
          choco install llvm --allow-downgrade --version=17.0.6

      - name: Cache bazel
        uses: actions/cache@v4
        with:
          path: c:/users/runneradmin/_bazel_runneradmin
          key: ${{ runner.os }}-verible-bazel-${{ env.VERIBLE_VERSION }}

      - name: Build verible-verilog-ls
        working-directory: verible
        run: |
          C:/ProgramData/chocolatey/lib/bazel/bazel.exe build --keep_going --noshow_progress -c opt //verible/verilog/tools/ls:verible-verilog-ls

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: verible-verilog-ls-windows
          path: verible/bazel-bin/verible/verilog/tools/ls/verible-verilog-ls.exe

  ##############################################################################
  # Build TerosHDL
  ##############################################################################
  build:
    name: Build .vsix
    runs-on: ubuntu-22.04
    needs: [build-verible-linux, build-verible-windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set version stable
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
        run: |
          PACKAGE_VERSION=$(cat package.json \
            | grep version \
            | head -1 \
            | awk -F: '{ print $2 }' \
            | sed 's/[",]//g')

          echo "version=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Set version dev
        if: github.ref == 'refs/heads/dev'
        run: |
          now=`date +"%Y-%m-%d__%H_%M"`
          echo "version=$now" >> $GITHUB_ENV

      - name: Set version pull request
        if: github.event == 'pull_request'
        run: |
          now=`date +"%Y-%m-%d__%H_%M"`
          echo "version=$now" >> $GITHUB_ENV

      - name: Download verible language server
        uses: actions/download-artifact@v4
        with:
          pattern: verible-verilog-ls-*
          path: verible-artifacts

      - name: Assemble verible binaries
        run: |
          mkdir -p server/verible/${{ env.VERIBLE_VERSION }}
          cp verible-artifacts/verible-verilog-ls-linux/verible-verilog-ls server/verible/${{ env.VERIBLE_VERSION }}/
          cp verible-artifacts/verible-verilog-ls-windows/verible-verilog-ls.exe server/verible/${{ env.VERIBLE_VERSION }}/

      - name: Checkout rust_hdl (vhdl_ls language server)
        uses: actions/checkout@v4
        with:
          repository: fransschreuder/rust_hdl
          ref: feat/411-enhanced-unused-detection
          path: rust_hdl

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'

      - name: Add Windows MSVC target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_hdl/target
          key: ${{ runner.os }}-vhdl_ls-${{ hashFiles('rust_hdl/**/Cargo.lock') }}

      - name: Install cargo-xwin
        run: cargo install cargo-xwin

      - name: Build vhdl_ls (Linux)
        run: cargo build --release --manifest-path rust_hdl/vhdl_ls/Cargo.toml

      - name: Build vhdl_ls (Windows)
        run: cargo xwin build --release --target x86_64-pc-windows-msvc --manifest-path rust_hdl/vhdl_ls/Cargo.toml

      - name: Assemble vhdl_ls binaries
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' rust_hdl/Cargo.toml | head -n 1)
          mkdir -p server/vhdl_ls/${VERSION}/vhdl_ls-x86_64-unknown-linux-musl/bin
          cp -R rust_hdl/vhdl_libraries server/vhdl_ls/${VERSION}/vhdl_ls-x86_64-unknown-linux-musl/
          cp rust_hdl/target/release/vhdl_ls server/vhdl_ls/${VERSION}/vhdl_ls-x86_64-unknown-linux-musl/bin/
          mkdir -p server/vhdl_ls/${VERSION}/vhdl_ls-x86_64-pc-windows-msvc/bin
          cp -R rust_hdl/vhdl_libraries server/vhdl_ls/${VERSION}/vhdl_ls-x86_64-pc-windows-msvc/
          cp rust_hdl/target/x86_64-pc-windows-msvc/release/vhdl_ls.exe server/vhdl_ls/${VERSION}/vhdl_ls-x86_64-pc-windows-msvc/bin/

      - name: Prepare teroshdl
        run: |
          npm install

      - name: Build
        id: build
        run: |
          npm install -g @vscode/vsce
          npm run-script package

          file=`ls *.vsix`
          echo ${{ env.version }}
          file_ver="${{ env.version }}_${file}"
          file_ver="${file_ver/:/"_"}"
          file_ver="${file_ver/ /""}"
          echo "${{ github.workspace }}/$file_ver"
          ls ${{ github.workspace }}
          mv $file ${{ github.workspace }}/$file_ver

      - name: Build Pre Release
        id: build-pre-release
        run: |
          npm install -g @vscode/vsce
          npm run-script package-prerelease

          file=`ls *pre-release.vsix`
          echo ${{ env.version }}
          file_ver="${{ env.version }}_prerelease_${file}"
          file_ver="${file_ver/:/"_"}"
          file_ver="${file_ver/ /""}"
          echo "${{ github.workspace }}/$file_ver"
          ls ${{ github.workspace }}
          mv $file ${{ github.workspace }}/$file_ver

      - name: Archive vsix
        uses: actions/upload-artifact@v4
        with:
          name: teroshld
          path: |
            *.vsix

      - uses: "marvinpinto/action-automatic-releases@latest"
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          automatic_release_tag: "${{ env.version }}"
          files: |
            *.vsix

      - uses: "marvinpinto/action-automatic-releases@latest"
        if: github.ref == 'refs/heads/dev'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          automatic_release_tag: latest
          files: |
            *.vsix